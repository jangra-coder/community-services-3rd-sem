# Render Blueprint – one-click deployment of EventPass on Render's free tier.
# Docs: https://render.com/docs/blueprint-spec
#
# Creates:
#   - a web service built from the Dockerfile (API + built React app)
#   - a free PostgreSQL database (note: Render's free databases expire after
#     30 days – see docs/DEPLOYMENT.md for the free Neon alternative)
#
# Values marked `sync: false` are asked for in the Render dashboard when the
# blueprint is applied. Email settings can be left blank to start with: the
# ticket is always shown on screen, and emails are then only logged.

services:
  - type: web
    name: eventpass
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: AUTO_MIGRATE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eventpass-db
          property: connectionString
      # CLIENT_URL is derived from RENDER_EXTERNAL_URL automatically.
      - key: ORGANIZER_SIGNUP_CODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: eventpass-db
    plan: free
    region: singapore
    databaseName: eventpass
    user: eventpass
