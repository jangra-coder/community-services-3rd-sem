name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventpass
          POSTGRES_PASSWORD: eventpass
          POSTGRES_DB: eventpass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventpass"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Server tests
        run: npm run test -w server
        env:
          TEST_DATABASE_URL: postgres://eventpass:eventpass@localhost:5432/eventpass_test

      - name: Client build
        run: npm run build -w client

      - name: Client tests
        run: npm run test -w client
