# Local development services.
#
#   docker compose up -d            # PostgreSQL + Mailpit (then run `npm run dev` on your machine)
#   docker compose --profile app up # ...plus the EventPass app itself, built from the Dockerfile
#
# The `app` profile runs in production mode and therefore REQUIRES a real
# JWT_SECRET in the environment (there is deliberately no default):
#   JWT_SECRET=$(openssl rand -hex 48) docker compose --profile app up
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventpass
      POSTGRES_PASSWORD: eventpass
      POSTGRES_DB: eventpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpass -d eventpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends. Inbox UI: http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://eventpass:eventpass@db:5432/eventpass
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - generate one with: openssl rand -hex 48}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SERVE_CLIENT: "true"
      # The app is expected to sit behind an HTTPS reverse proxy (Caddy, Nginx...)
      TRUST_PROXY: "1"
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "4000:4000"

volumes:
  pgdata:
